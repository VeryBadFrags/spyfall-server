services:
  spyfall-server:
    build:
      context: .
    ports:
      - "8081:8081"
    restart: always
    command: "node --watch --experimental-transform-types src/main.ts"
    init: true
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: rebuild
          path: package.json
        - action: rebuild
          path: pnpm-lock.yaml
